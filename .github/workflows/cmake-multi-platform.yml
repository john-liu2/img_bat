# This workflow builds a CMake C/C++ project on macOS, Windows, and Linux.
name: CMake Multi-Platform CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Build (${{ matrix.os }}, ${{ matrix.build-type }})

    strategy:
      # Should set to true if you want to stop the build on the first failure
      fail-fast: false
      max-parallel: 3
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        build-type: [Release]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Show matrix
        shell: bash
        run: |
          echo "matrix.os = ${{ matrix.os }}"
          echo "runner.os = $RUNNER_OS"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Show runner
        shell: bash
        run: |
          echo "OS: $RUNNER_OS"
          echo "Runner: $RUNNER_NAME"

      - name: Install dependencies - macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew update
          brew install opencv libheif exiv2

      - name: Install dependencies - Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libopencv-dev \
            libheif-dev \
            libexiv2-dev \
            pkg-config \
            python3

      - name: Configure CMake - macOS/Linux
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            CXX=clang++
          else
            CXX=g++
          fi

          cmake \
            -S "${{ github.workspace }}" \
            -B "${{ github.workspace }}/build" \
            -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_CXX_STANDARD=17 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_CXX_EXTENSIONS=OFF

      - name: Diagnose Visual Studio
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          Write-Host "vswhere: $vswhere"

          & $vswhere `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

          Write-Host "`nC++ compiler files:"

          Get-ChildItem `
            "C:\Program Files\Microsoft Visual Studio\18" `
            -Filter cl.exe `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty FullName

      - name: Install dependencies - Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vcpkg = "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe"

          Write-Host "Using vcpkg: $vcpkg"

          if (-not (Test-Path $vcpkg)) {
            throw "vcpkg was not found"
          }

          & $vcpkg version

          & $vcpkg install `
            opencv `
            libheif `
            exiv2 `
            --triplet x64-windows

      - name: Configure CMake - Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake `
            -S "${{ github.workspace }}" `
            -B "${{ github.workspace }}/build" `
            -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} `
            -G "Visual Studio 18 2026" `
            -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_CXX_STANDARD=17 `
            -DCMAKE_CXX_STANDARD_REQUIRED=ON `
            -DCMAKE_CXX_EXTENSIONS=OFF


      - name: Build
        run: |
          cmake --build "${{ github.workspace }}/build" `
            --config ${{ matrix.build-type }} `
            --parallel

      - name: Test
        working-directory: ${{ github.workspace }}/build
        run: |
          ctest --build-config ${{ matrix.build-type }} --output-on-failure
