# This workflow is for a CMake project running on multiple platforms.
name: CMake Multi-Platform CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all combinations.
      # Change this to true when the workflow is stable.
      fail-fast: false

      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        build_type: [Release]
        cpp_compiler: [g++, clang++, cl]
        include:
          - os: macos-latest
            cpp_compiler: clang++
          - os: windows-latest
            cpp_compiler: cl
          - os: ubuntu-latest
            cpp_compiler: g++
        exclude:
          - os: macos-latest
            cpp_compiler: [cl, g++]
          - os: windows-latest
            cpp_compiler: [g++, clang++]
          - os: ubuntu-latest
            cpp_compiler: [cl, clang++]

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set reusable strings
      # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Configure CMake
      run: >
        cmake -B build ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -S ${{ github.workspace }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_CXX_STANDARD_REQUIRED=ON
        -DCMAKE_CXX_EXTENSIONS=OFF

    - name: Build
      # Build your program with the given configuration. Note that --config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      run: cmake --parallel --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more
      run: ctest --build-config ${{ matrix.build_type }} --output-on-failure
