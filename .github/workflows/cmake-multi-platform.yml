# This workflow builds a CMake C/C++ project on macOS, Windows, and Linux.
name: CMake Multi-Platform CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    strategy:
      # Should set to true if you want to stop the build on the first failure
      fail-fast: false
      matrix:
        build-type: [Release]
        include:
          - os: macos-latest
            compiler: clang++

          - os: ubuntu-latest
            compiler: g++

          - os: windows-latest
            compiler: msvc

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies - macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew update
          brew install opencv libheif exiv2

      - name: Install dependencies - Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libopencv-dev \
            libheif-dev \
            libexiv2-dev \
            pkg-config \
            python3

      - name: Configure CMake - macOS/Linux
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cmake \
            -S "${{ github.workspace }}" \
            -B "${{ github.workspace }}/build" \
            -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} \
            -DCMAKE_CXX_STANDARD=17 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_CXX_EXTENSIONS=OFF

      - name: Diagnose Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "Runner: $env:RUNNER_OS"
          Write-Host "Image: $env:ImageVersion"

          cmake --version

          Write-Host "`nVisual Studio installations:"
          Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -ErrorAction SilentlyContinue

          Write-Host "`nCMake generators:"
          cmake --help | Select-String "Visual Studio"

          Write-Host "`nMSVC compiler:"
          where.exe cl 2>$null

      - name: Install dependencies - Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vcpkg = "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe"

          Write-Host "Using vcpkg: $vcpkg"

          if (-not (Test-Path $vcpkg)) {
            throw "vcpkg was not found"
          }

          & $vcpkg version

          & $vcpkg install `
            opencv `
            libheif `
            exiv2 `
            --triplet x64-windows

      - name: Configure CMake - Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake `
            -S "${{ github.workspace }}" `
            -B "${{ github.workspace }}/build" `
            -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_CXX_STANDARD=17 `
            -DCMAKE_CXX_STANDARD_REQUIRED=ON `
            -DCMAKE_CXX_EXTENSIONS=OFF `

      - name: Build
        run: |
          cmake --build "${{ github.workspace }}/build" `
            --config ${{ matrix.build-type }} `
            --parallel

      - name: Test
        working-directory: ${{ github.workspace }}/build
        run: |
          ctest --build-config ${{ matrix.build-type }} --output-on-failure
