# This workflow builds a CMake C/C++ project on macOS, Windows, and Linux.
name: CMake Multi-Platform CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Build (${{ matrix.os }}, ${{ matrix.build-type }})

    strategy:
      # Should set to true if you want to stop the build on the first failure
      fail-fast: false
      max-parallel: 3
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        build-type: [Release]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Show Matrix & Runner
        shell: bash
        run: |
          echo "matrix.os = ${{ matrix.os }}"
          echo "runner.os = $RUNNER_OS"
          echo "Runner: $RUNNER_NAME"

      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies - macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew untap aws/tap 2>/dev/null || true
          brew install opencv libheif exiv2

      - name: Install dependencies - Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libopencv-dev \
            libheif-dev \
            libexiv2-dev \
            libheif-examples \
            libheif-plugin-x265 \
            libheif-plugin-libde265 \
            pkg-config \
            python3

          echo "=== libheif ==="
          dpkg -l | grep libheif || true

          echo "=== HEIF encoder ==="
          command -v heif-enc || true

          echo "=== heif-enc version ==="
          heif-enc --version || true

          echo "=== libheif codecs ==="
          heif-enc --list-encoders || true

      - name: Configure CMake - macOS/Linux
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            CXX=clang++
          else
            CXX=g++
          fi

          cmake \
            -S "${{ github.workspace }}" \
            -B "${{ github.workspace }}/build" \
            -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_CXX_STANDARD=17 \
            -DCMAKE_CXX_STANDARD_REQUIRED=ON \
            -DCMAKE_CXX_EXTENSIONS=OFF

      - name: Diagnose Visual Studio
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          Write-Host "vswhere: $vswhere"

          & $vswhere `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

          Write-Host "`nC++ compiler files:"

          Get-ChildItem `
            "C:\Program Files\Microsoft Visual Studio\18" `
            -Filter cl.exe `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Select-Object -ExpandProperty FullName

      - name: Install dependencies - Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vcpkg = "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe"

          & $vcpkg version
          & $vcpkg install `
            opencv `
            libheif `
            exiv2 `
            --triplet x64-windows

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          & $vcpkg list | Select-String "opencv|libheif|exiv2"

      - name: Diagnose vcpkg - Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vcpkg = "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe"

          & $vcpkg list | Select-String "libheif|opencv|exiv2"

          Write-Host "`nlibheif files:"
          Get-ChildItem `
            "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows" `
            -Recurse `
            -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Name -match "libheif|heif.*cmake"
            } |
            Select-Object FullName

      - name: Configure CMake - Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake `
            -S "${{ github.workspace }}" `
            -B "${{ github.workspace }}/build" `
            -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} `
            -G "Visual Studio 18 2026" `
            -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_PREFIX_PATH="$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows" `
            -DCMAKE_CXX_STANDARD=17 `
            -DCMAKE_CXX_STANDARD_REQUIRED=ON `
            -DCMAKE_CXX_EXTENSIONS=OFF


      - name: Build
      # Cross-platform: use a single-line cmake command
        run: cmake --build "${{ github.workspace }}/build" --config ${{ matrix.build-type }} --parallel

      - name: Test
        working-directory: ${{ github.workspace }}/build
        # Cross-platform: use a single-line ctest command
        run: ctest --build-config ${{ matrix.build-type }} --output-on-failure
